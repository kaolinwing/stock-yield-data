# 每日封存:台灣時間 06:10 / 13:10 / 20:10 各跑一次(避開整點尖峰;GitHub 排程可能延遲或漏跑,三次互為備援)。
# 同一份資料依資料日期只存一次,沒有新資料就不提交。任一張表失敗時已成功的照樣提交,但本次標為失敗(GitHub 寄通知)。
name: archive

on:
  schedule:
    - cron: "10 22 * * *"   # 06:10 Asia/Taipei
    - cron: "10 5 * * *"    # 13:10 Asia/Taipei
    - cron: "10 12 * * *"   # 20:10 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write   # 提交資料
  pages: write      # 要求 Pages 重建

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: swift build -c release --product archiver

      - name: Archive
        id: archive
        env:
          ARCHIVE_ENCRYPTION_KEY: ${{ secrets.ARCHIVE_ENCRYPTION_KEY }}
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
        run: .build/release/archiver --output v1

      - name: Commit
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          if git diff --cached --quiet; then
            echo "沒有新資料"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Taipei date '+%F %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
